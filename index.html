<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人数字名片</title>
    <style>
        :root {
            --accent: #4facfe;
            --clip: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        body {
            background: #02040a;
            color: #fff;
            font-family: "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 旋转流光背景层 */
        .box {
            position: relative;
            width: 340px;
            padding: 3px;
            background: linear-gradient(0deg, transparent, #00f2fe, var(--accent));
            clip-path: var(--clip);
            animation: flow 4s linear infinite;
        }

        @keyframes flow {
            100% {
                filter: hue-rotate(360deg);
            }
        }

        /* 内容主体 */
        .content {
            background: #0d1117;
            padding: 30px;
            clip-path: var(--clip);
        }

        .header {
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .name {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info {
            margin-top: 20px;
            border-top: 1px solid #30363d;
            padding-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #8b949e;
        }

        .info-row b {
            color: #fff;
            font-family: monospace;
        }

        .achievement {
            margin-top: 25px;
            padding: 12px;
            background: linear-gradient(45deg, #1f2937, #111827);
            border-right: 4px solid var(--accent);
            text-align: right;
        }

        .ach-label {
            font-size: 10px;
            color: var(--accent);
            display: block;
            margin-bottom: 5px;
        }

        .ach-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffca28;
            text-shadow: 0 0 10px rgba(255,202,40,0.5);
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="content">
            <div class="header">STATUS: ACTIVE</div>
            <h1 class="name">张三</h1>
            <div class="info">
                <div class="info-row"><span>学号</span><b>243200582</b></div>
                <div class="info-row"><span>班级</span><b>计算机应用技术2406班</b></div>
            </div>
            <div class="achievement">
                <span class="ach-label">MAJOR ACHIEVEMENT 成就</span>
                <span class="ach-value">全国高校计算机挑战赛一等奖<br>王者荣耀巅峰赛2500分</span>
            </div>
        </div>
    </div>

</body>
</html>
